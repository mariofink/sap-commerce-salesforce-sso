# =====================================================================
# Salesforce SSO prototype (Phase 1) — SAML 2.0 Service Provider config
# See docs/salesforce-sso-prototype-plan.md
# SP signing/encryption keystore generated for the samlsinglesignon extension.
# Values match keystore at:
#   bin/modules/platform/samlsinglesignon/web/webroot/WEB-INF/security/samlKeystore.jks
# =====================================================================
sso.keystore.location=/WEB-INF/security/samlKeystore.jks
sso.keystore.type=JKS
sso.keystore.password=changeit
sso.keystore.privatekey.alias=hybris
sso.keystore.privatekey.password=changeit
sso.keystore.default.certificate.alias=hybris

# --- SP identity ---
sso.entity.id=urn:ssoextension:hybris:de
sso.relyingPartyRegistration.registrationId=registrationId

# Use modern Spring Security SAML2 endpoints (/saml2/... and /login/saml2/sso/...)
# rather than the legacy /saml/* ones. Our Salesforce ACS + SP metadata URLs assume this.
sso.legacy.endpoints.enabled=false

# --- IdP (Salesforce) metadata file ---
# Place the Salesforce IdP metadata.xml here (path relative to the samlsinglesignon webapp,
# i.e. .../samlsinglesignon/web/webroot/WEB-INF/security/metadata.xml)
sso.metadata.location=./WEB-INF/security/metadata.xml

# --- Metadata signature verification ---
# The extension validates the IdP metadata file signature against certs in the SP
# keystore. Salesforce IdP metadata is signed by the Salesforce cert, which is NOT
# in our SP keystore. For the localhost prototype, disable file-signature verification
# (assertion signatures are still validated via the IdP cert embedded in the metadata).
sso.metadata.verification.enabled=false

# --- Logout redirect target ---
# OOTB default; only used by the samlsinglesignon SAML single-logout flow, which this
# prototype does NOT use (logout is local-only — see storefront.sso.logout.url below).
samlsinglesignon.logout.redirect.url=/logout.jsp
# =====================================================================
# Salesforce SSO prototype (Phase 4) — SAML attribute mapping & JIT B2BCustomer
# DefaultSSOService.getOrCreateSSOUser() reads uid/name/roles from SAML *attributes*
# (there is NO NameID fallback), then JIT-creates the user with the type+groups
# resolved from sso.mapping.<role>.*  See docs/salesforce-sso-values-and-checklist.md
# =====================================================================
# SAML attribute keys. Salesforce auto-sends email/firstName/lastName/username/userId
# as STANDARD attributes (that's why 'email'/'userId' are "reserved" as custom keys).
# We reuse those standard ones for uid/name. Only the group must be added as a custom
# Salesforce attribute named 'usergroup' (static value 'b2bcustomer').
sso.userid.attribute.key=email
sso.firstname.attribute.key=firstName
sso.lastname.attribute.key=lastName
sso.usergroup.attribute.key=usergroup

# Role -> (user type + Commerce groups) mapping.
# Salesforce sends SAML attribute usergroup=b2bcustomer ; that maps here:
sso.mapping.b2bcustomer.usertype=B2BCustomer
# NOTE: a B2BCustomer cannot be saved without belonging to a B2BUnit
# (B2BCustomerModelValidateInterceptor -> "All B2B Customers must be a member of a B2B Unit").
# DefaultSSOService only sets groups, so we assign an existing sample B2BUnit ("Rustic")
# as one of the groups; B2BUnitService.getParent() then resolves it and validation passes.
sso.mapping.b2bcustomer.groups=b2bcustomergroup,Rustic

# --- Phase 5: SSO-only storefront wiring ---
# The storefront /login page redirects anonymous users to this SP-initiated SAML URL
# (no native username/password form). Consumed by LoginPageController.
storefront.sso.login.url=/samlsinglesignon/saml2/authenticate/registrationId
# After a successful SAML assertion the ACS redirects here. This MUST be a samlsinglesignon
# URL under /saml/ so that (a) the request is still authenticated (Saml2 principal in session)
# and passes through saml2UserFilter, which writes the single-use "samlPassThroughToken"
# login cookie, and (b) the OOTB RedirectionController (@RequestMapping /saml/**) then forwards
# the browser to sso.redirect.url below. The success handler prepends the /samlsinglesignon
# context path, so "/saml/" resolves to /samlsinglesignon/saml/.
sso.success.redirect.url=/saml/
# Final destination after the login cookie has been written: the powertools storefront home.
# The storefront's SamlSsoLoginFilter consumes the samlPassThroughToken cookie here and
# establishes the authenticated B2BCustomer session. Absolute URL (different webapp/host).
sso.redirect.url=https://powertools.local:9002/yb2bacceleratorstorefront/
# Where the storefront sends the user after clearing its LOCAL session (LogoutFilter +
# SecurityContextLogoutHandler). This prototype uses LOCAL-ONLY logout: the storefront
# (and its Hybris) session is terminated, but the Salesforce IdP session is intentionally
# left intact. Consequence (accepted, standard SSO behaviour): clicking login again re-uses
# the live Salesforce session and signs the user straight back in without a password prompt.
# True SAML Single Logout was deliberately NOT implemented because it would require patching
# the OOTB (gitignored) samlsinglesignon extension. See docs for the full rationale.
storefront.sso.logout.url=/?logout=true

